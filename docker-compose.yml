services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pasmenpasara_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: gunicorn --bind 0.0.0.0:8000 --preload pasmenpasara.wsgi:application
    #volumes:
    #  - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: celery -A pasmenpasara worker -l info
    #volumes:
     # - ./backend:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: celery -A pasmenpasara beat -l info
    #volumes:
      #- ./backend:/app
    depends_on:
      - db
      - redis

  posadminapp:
    build:
      context: ./management-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    restart: always
    ports:
      - "83:80"
    depends_on:
      - web

  managemnetapp:
    build:
      context: ./midnight-vicewave-builder
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_NGROK}
        VITE_API_MAIN_BRANCH: ${VITE_API_MAIN_BRANCH_NGROK}
        VITE_API_FRONTLINE_BRANCH: ${VITE_API_FRONTLINE_BRANCH_NGROK}
        VITE_API_ACCUZI_BRANCH: ${VITE_API_ACCUZI_BRANCH_NGROK}
        VITE_API_TEKCREDIT_BRANCH: ${VITE_API_TEKCREDIT_BRANCH_NGROK}
    restart: always
    ports:
      - "81:80"  # Exposed as host port 81
    depends_on:
      - web
      
  localmanagementapp:
    build:
      context: ./midnight-vicewave-builder
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_MAIN_BRANCH: ${VITE_API_MAIN_BRANCH}
        VITE_API_FRONTLINE_BRANCH: ${VITE_API_FRONTLINE_BRANCH}
        VITE_API_ACCUZI_BRANCH: ${VITE_API_ACCUZI_BRANCH}
        VITE_API_TEKCREDIT_BRANCH: ${VITE_API_TEKCREDIT_BRANCH}
    restart: always
    ports:
      - "84:80"  # Exposed as host port 81
    depends_on:
      - web

  serversapp:
    build:
      context: ./order-runner-pro
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    restart: always
    ports:
      - "82:80"  # Exposed as host port 82
    depends_on:
      - web

  #ngrok:
   # image: ngrok/ngrok:latest
    #restart: always
    #command: start --all --config /etc/ngrok/ngrok.yml --log stdout
    #volumes:
     # - ./ngrok.yml:/etc/ngrok/ngrok.yml
    #ports:
     # - "4040:4040"

volumes:
  postgres_data:
