services:
  db:
    image: postgres:15
    environment:
        POSTGRES_DB: pasmenpasara_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: supersecretpassword
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - /app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: celery -A pasmenpasara worker -l info
    volumes:
      - /app
    depends_on:
      - db
      - redis


  celery-beat:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: celery -A pasmenpasara beat -l info
    volumes:
      - /app
    depends_on:
      - db
      - redis


volumes:
  postgres_data:
